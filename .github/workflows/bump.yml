name: bump
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Move each plugin to its newest release
        run: python3 scripts/bump.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the store tests
        run: make test
      - name: Commit only when something moved
        run: |
          if ! git diff --quiet; then
            git config user.name 'solancelab-bump'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -am 'Store: newest plugin releases (automatic)'
            git push
          fi
